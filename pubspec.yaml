name: candyconnect
description: "CandyConnect Cross-Platform Secure Proxy & VPN Client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  ffi: ^2.2.0
  screen_capturer: ^0.2.3
  image_picker: ^1.1.2
  zxing2: ^0.2.4
  image: ^4.9.1
  device_apps: ^2.2.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  linux:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.ico"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/routing/
    - assets/icons/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700