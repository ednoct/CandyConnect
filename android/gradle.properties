# JVM heap for the Gradle daemon.
# 8 GB is generous; reduce to 4G if you hit memory pressure on CI.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX (required by all modern Flutter plugins).
android.useAndroidX=true

# Enable parallel builds and configuration cache for faster incremental builds.
org.gradle.parallel=true
org.gradle.configureondemand=true

# Suppress the Kotlin embedded-DSL version warning (Gradle uses its own Kotlin;
# the project-level KGP 2.3.20 is separate).
kotlin.stdlib.default.dependency=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
