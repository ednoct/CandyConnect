include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - ".dart_tool/**"
    - "linux/flutter/**"
    - "windows/flutter/**"
    - "macos/Flutter/**"
    - "ios/Flutter/**"

linter:
  rules:
    constant_identifier_names: false
    non_constant_identifier_names: false
    use_build_context_synchronously: true
    avoid_print: false